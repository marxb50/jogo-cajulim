<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Turma do Cajulim - Edição Celular</title>
    <link rel="icon" type="image/png" href="assets/ui/parnamirim_logo.png">
    <link rel="stylesheet" href="style.css?v=9.1">
    <script>
        // Anti-scroll / anti-zoom guard for mobile touch
        document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, { passive: false });
        document.addEventListener('touchmove', function(e) {
            if (e.target.closest('#touchControlsLayer') || e.target.closest('#gameCanvas')) {
                e.preventDefault();
            }
        }, { passive: false });

        // Auto Fullscreen ao virar o celular na horizontal (Paisagem)
        function triggerAutoFullscreen() {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape && !document.fullscreenElement && !document.webkitFullscreenElement) {
                const doc = document.documentElement;
                if (doc.requestFullscreen) {
                    doc.requestFullscreen().catch(() => {});
                } else if (doc.webkitRequestFullscreen) {
                    doc.webkitRequestFullscreen();
                }
                if (window.screen && window.screen.orientation && window.screen.orientation.lock) {
                    window.screen.orientation.lock('landscape').catch(() => {});
                }
            }
        }

        window.addEventListener('orientationchange', function() {
            setTimeout(triggerAutoFullscreen, 150);
            setTimeout(triggerAutoFullscreen, 400);
        });
        if (window.screen && window.screen.orientation) {
            window.screen.orientation.addEventListener('change', function() {
                setTimeout(triggerAutoFullscreen, 150);
                setTimeout(triggerAutoFullscreen, 400);
            });
        }
        window.addEventListener('resize', function() {
            if (window.innerWidth > window.innerHeight) {
                setTimeout(triggerAutoFullscreen, 100);
            }
        });
        document.addEventListener('touchstart', triggerAutoFullscreen, { passive: true });
        document.addEventListener('pointerdown', triggerAutoFullscreen, { passive: true });
    </script>
</head>
<body>

    <main class="mobile-wrapper" id="mobileWrapper">
        <div class="portrait-console-label" aria-hidden="true">
            <img src="assets/ui/parnamirim_logo.png" alt="">
            <span>TURMA DO CAJULIM · EDIÇÃO PORTÁTIL</span>
        </div>

        <!-- Barra Superior Flutuante Minimalista (Apenas Botões) -->
        <header class="mobile-top-bar">
            <div></div>
            <div class="mobile-actions">
                <a href="../index.html?view=phases&platform=celular" class="top-circle-btn" id="btnMobileHomePortal" title="Menu Principal / Escolher Fases" style="text-decoration:none; display:inline-flex; align-items:center; justify-content:center;">🏠</a>
                <button class="top-circle-btn" id="btnMobileSound" title="Ativar/Desativar Som">🔊</button>
                <button class="top-circle-btn" id="btnMobileFullscreen" title="Tela Cheia">⛶</button>
            </div>
        </header>

        <!-- Canvas do Jogo 16:9 Adaptado -->
        <div class="canvas-container">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
        </div>

        <!-- Controles Virtuais Semi-Transparentes na Tela -->
        <div class="touch-controls-layer" id="touchControlsLayer">
            <!-- Lado esquerdo: analógico para oito direções -->
            <div class="joystick-zone" id="joystickZone">
                <div class="joystick-base" id="joystickBase" role="application" aria-label="Controle analógico: arraste a bola para andar em qualquer direção">
                    <span class="joystick-direction direction-up" aria-hidden="true"></span>
                    <span class="joystick-direction direction-right" aria-hidden="true"></span>
                    <span class="joystick-direction direction-down" aria-hidden="true"></span>
                    <span class="joystick-direction direction-left" aria-hidden="true"></span>
                    <div class="joystick-knob" id="joystickKnob" aria-hidden="true">
                        <span class="joystick-shine"></span>
                    </div>
                </div>
            </div>

            <!-- Lado direito: único botão usado pelo jogo -->
            <div class="actions-zone" id="actionsZone">
                <button class="action-btn btn-a" id="btnTouchA" aria-label="Botão A: Pular, agir ou avançar">
                    <span class="btn-main">A</span>
                    <span class="btn-sub">AÇÃO</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Scripts do Jogo -->
    <script src="narrations.js?v=9.1"></script>
    <script src="audio.js?v=9.1"></script>
    <script src="game.js?v=9.2"></script>
</body>
</html>
