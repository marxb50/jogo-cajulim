<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Turma do Cajulim - Edição PC</title>
    <link rel="stylesheet" href="style.css?v=1.0">
    <script>
        // Anti-scroll guard
        window.addEventListener('keydown', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.key === ' ' || e.keyCode === 32) {
                e.preventDefault();
            }
        }, { passive: false });
        window.addEventListener('keyup', function(e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.key === ' ' || e.keyCode === 32) {
                e.preventDefault();
            }
        }, { passive: false });
    </script>
</head>
<body>

    <!-- Header com Identidade Visual de Parnamirim -->
    <header class="header-container">
        <img src="assets/ui/parnamirim_logo.png" alt="Prefeitura de Parnamirim - Secretaria de Limpeza Urbana" class="header-logo">
        <div>
            <h1 class="game-title">TURMA DO CAJULIM</h1>
            <p class="game-subtitle">A Grande Missão da Coleta Seletiva - Jogo de Plataforma 2D</p>
        </div>
    </header>

    <!-- Gabinete Arcade PC -->
    <main class="arcade-wrapper" id="arcadeContainer">
        <div class="canvas-container">
            <canvas id="gameCanvas" width="960" height="540"></canvas>
        </div>

        <!-- Barra de Controles e Atalhos -->
        <footer class="controls-bar">
            <div class="controls-hint">
                <span class="control-key">←</span> <span class="control-key">→</span> ou <span class="control-key">A</span> <span class="control-key">D</span> Mover |
                <span class="control-key">ESPAÇO</span> ou <span class="control-key">W</span> Pular / Ação |
                <span class="control-key">↓</span> ou <span class="control-key">S</span> Freio
            </div>
            <div class="controls-actions">
                <a href="../index.html?view=phases&platform=PC" class="btn-arcade" id="btnHomePortal" title="Menu Principal / Escolher Fases" style="text-decoration:none;">🏠 Menu / Fases</a>
                <button class="btn-arcade" id="btnSound" onclick="if(window.soundManager) window.soundManager.toggleMute();" title="Ativar/Desativar Som (Tecla M)">
                    🔊 Som (M)
                </button>
                <button class="btn-arcade" id="btnFullscreen" onclick="if(window.game) window.game.toggleFullscreen();" title="Tela Cheia (Tecla F ou 2x Clique)">
                    ⛶ Tela Cheia (F)
                </button>
                <button class="btn-arcade" id="btnRestart" onclick="if(window.game) window.game.restartLevel();" title="Reiniciar Fase (Tecla R)">
                    🔄 Reiniciar (R)
                </button>
            </div>
        </footer>
    </main>

    <!-- Scripts do Jogo -->
    <script src="audio.js?v=7.0"></script>
    <script src="game.js?v=7.2"></script>
</body>
</html>
